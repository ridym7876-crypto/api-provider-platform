<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>API Provider Platform</title>
<meta name="description" content="Developer portal and API management console for the API Provider Platform." />
<style>
  :root{
    --bg:#0b0f17; --panel:#121826; --panel-2:#1a2233; --line:#243044;
    --text:#e8eef8; --muted:#8d9bb3; --brand:#4f8cff; --brand-dim:#2f5cab;
    --ok:#37d39b; --warn:#f0b34a; --bad:#f2637c; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  pre{background:#0d1320;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12.5px}
  code{background:#182034;padding:1px 5px;border-radius:4px;font-size:12.5px}
  header{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .nav{display:flex;align-items:center;gap:18px;height:60px}
  .brand{font-weight:700;letter-spacing:-.2px;font-size:15px;display:flex;align-items:center;gap:9px;color:var(--text)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .nav nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
  .nav button{background:none;border:0;color:var(--muted);padding:7px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500}
  .nav button:hover{background:var(--panel-2);color:var(--text)}
  .nav button.active{background:var(--panel-2);color:var(--text)}
  .spacer{flex:1}
  main{padding:28px 0 70px;min-height:70vh}
  h1{font-size:25px;letter-spacing:-.4px;margin:0 0 6px}
  h2{font-size:17px;margin:26px 0 12px;letter-spacing:-.2px}
  h3{font-size:14.5px;margin:18px 0 8px}
  p{color:var(--muted);margin:6px 0}
  .lead{color:var(--muted);font-size:14.5px;max-width:70ch}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat .label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .stat .value{font-size:24px;font-weight:650;margin-top:6px;letter-spacing:-.5px}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;background:#0d1320;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit}
  textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-dim);box-shadow:0 0 0 3px rgba(79,140,255,.12)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand);color:#fff;
    border:0;border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{background:#3d7bf0}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.ghost:hover{background:var(--panel-2)}
  .btn.danger{background:transparent;border:1px solid #4b2333;color:var(--bad)}
  .btn.danger:hover{background:#2a1520}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid #1b2434;vertical-align:top}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#141c2b}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em}
  .pill.ok{background:rgba(55,211,155,.14);color:var(--ok)}
  .pill.bad{background:rgba(242,99,124,.14);color:var(--bad)}
  .pill.warn{background:rgba(240,179,74,.14);color:var(--warn)}
  .pill.muted{background:#1b2434;color:var(--muted)}
  .method{font-weight:700;font-size:11px;letter-spacing:.05em}
  .m-GET{color:var(--ok)} .m-POST{color:var(--brand)} .m-PUT{color:var(--warn)} .m-DELETE{color:var(--bad)} .m-PATCH{color:#b28bff}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13.5px}
  .toast{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
  .toast div{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--brand);
    padding:11px 14px;border-radius:8px;font-size:13px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast div.err{border-left-color:var(--bad)}
  .toast div.ok{border-left-color:var(--ok)}
  .modal{position:fixed;inset:0;background:rgba(4,7,12,.75);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
  .modal .card{max-width:560px;width:100%}
  .secret{background:#0d1320;border:1px dashed var(--brand-dim);border-radius:8px;padding:12px;
    word-break:break-all;font-size:13px;color:#cfe0ff}
  .bar{height:7px;background:#1b2434;border-radius:4px;overflow:hidden;min-width:60px}
  .bar > i{display:block;height:100%;background:var(--brand)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #1b2434;font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--muted)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
    padding:9px 13px;cursor:pointer;font-size:13.5px;font-weight:500}
  .tabs button.active{color:var(--text);border-bottom-color:var(--brand)}
  .auth-wrap{max-width:400px;margin:40px auto}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
  .section-head h2{margin:0}
  details{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--panel)}
  summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;gap:10px;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+";color:var(--muted);font-weight:700}
  details[open] summary::before{content:"−"}
  .endpoint-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;font-size:12.5px;color:var(--muted)}
  .footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12.5px}
  .warnbox{background:rgba(240,179,74,.08);border:1px solid rgba(240,179,74,.3);border-radius:10px;padding:12px 14px;font-size:13px;margin:12px 0}
  @media(max-width:640px){ .nav{height:auto;padding:10px 0;flex-wrap:wrap} .nav nav{margin-left:0} main{padding:20px 0 50px} }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="brand"><span class="dot"></span> API Provider Platform</div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <div id="who" class="row" style="gap:8px"></div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer class="footer"><div class="wrap">
  API Provider Platform · Phase 1 · gateway, keys, quotas, usage analytics, docs and playground.
  <span id="hostline"></span>
</div></footer>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ------------------------------------------------------------------ config */
const BASE = "https://superagent-b31b88fd.base44.app/functions";
const TOKEN_KEY = "app_platform_token";
const state = { token: localStorage.getItem(TOKEN_KEY) || "", dev: null, view: "catalog", cache: {} };

/* ------------------------------------------------------------------ helpers */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === null || s === undefined ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const num = (n) => (n === null || n === undefined || isNaN(n)) ? "0" : Number(n).toLocaleString();
const pct = (n) => (Number(n) || 0).toFixed(2) + "%";

function toast(msg, kind){
  const el = document.createElement("div");
  el.className = kind || "";
  el.textContent = msg;
  $("toast").appendChild(el);
  setTimeout(() => el.remove(), 4600);
}

async function call(fn, payload, opts){
  opts = opts || {};
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers["X-Developer-Token"] = state.token;
  let res, body;
  try{
    res = await fetch(BASE + "/" + fn, {
      method: "POST", headers, body: JSON.stringify(payload || {}),
    });
    body = await res.json();
  }catch(e){
    throw new Error("Network error contacting " + fn + ": " + e.message);
  }
  if (!body || body.ok === false){
    const err = (body && body.error) || {};
    const e = new Error(err.message || ("Request failed (" + res.status + ")"));
    e.code = err.code; e.status = res.status;
    throw e;
  }
  return body.data;
}

/* ------------------------------------------------------------------ session */
async function loadSession(){
  if (!state.token) { state.dev = null; return; }
  try{
    const d = await call("devSession", { action: "me" });
    state.dev = d.developer; state.overview = d.overview; state.session = d.session;
  }catch(e){
    if (["invalid_token","token_expired","token_revoked","missing_token","profile_missing"].includes(e.code)){
      state.token = ""; localStorage.removeItem(TOKEN_KEY); state.dev = null;
    } else { toast(e.message, "err"); }
  }
}

/* ------------------------------------------------------------------ shell */
const NAV = [
  ["catalog","API Catalog"], ["docs","Documentation"], ["playground","Playground"],
  ["dashboard","Dashboard"], ["usage","Usage"], ["history","Requests"], ["admin","Admin"],
];

function renderNav(){
  const items = NAV.filter(([id]) => {
    if (["dashboard","usage","history"].includes(id)) return !!state.dev;
    if (id === "admin") return state.dev && state.dev.role === "admin";
    if (id === "playground") return true;
    return true;
  });
  $("nav").innerHTML = items.map(([id,label]) =>
    `<button class="${state.view===id?"active":""}" onclick="go('${id}')">${label}</button>`).join("");
  $("who").innerHTML = state.dev
    ? `<span class="pill muted">${esc(state.dev.email)}</span>
       <span class="pill ${state.dev.role==="admin"?"warn":"ok"}">${esc(state.dev.role)}</span>
       <button class="btn ghost sm" onclick="logout()">Sign out</button>`
    : `<button class="btn sm" onclick="openAuth('login')">Sign in</button>`;
  $("hostline").innerHTML = state.dev ? "" : " · <a href='#' onclick='openAuth(\"register\");return false'>Create a free developer account</a>";
}

function go(view){
  state.view = view;
  renderNav();
  const app = $("app");
  app.innerHTML = `<div class="empty">Loading…</div>`;
  ({ catalog: viewCatalog, docs: viewDocs, auth: viewAuth, dashboard: viewDashboard,
     usage: viewUsage, history: viewHistory, admin: viewAdmin, playground: viewPlayground }[view] || viewCatalog)();
}

function openAuth(tab){
  state.authTab = tab || "login";
  go("auth");
}

async function logout(){
  try{ await call("devSession", { action: "logout" }); }catch(e){}
  state.token = ""; localStorage.removeItem(TOKEN_KEY); state.dev = null;
  state.authTab = "login"; toast("Signed out", "ok"); go("catalog");
}

/* ------------------------------------------------------------------ catalog */
async function viewCatalog(){
  try{
    const d = await call("publicCatalog", {});
    state.cache.catalog = d;
    const apis = d.apis || [];
    $("app").innerHTML = `
      <h1>Public API catalog</h1>
      <p class="lead">${num(d.totals.apis)} published APIs · ${num(d.totals.endpoints)} endpoints · ${num(d.totals.categories)} categories.
      Every endpoint below is live and returns real computed data.</p>
      ${apis.length ? `<div class="grid g2" style="margin-top:20px">${apis.map(a => `
        <div class="card">
          <div class="row" style="justify-content:space-between">
            <strong>${esc(a.name)}</strong>
            <span class="pill muted">${esc(a.version || "v1")}</span>
          </div>
          <p style="margin:8px 0 12px">${esc(a.description)}</p>
          <div class="row" style="gap:6px;margin-bottom:12px">
            <span class="pill muted">${esc(a.category_slug || "uncategorised")}</span>
            <span class="pill muted">${num(a.endpoint_count)} endpoints</span>
            ${a.auth_required ? '<span class="pill warn">API key</span>' : '<span class="pill ok">open</span>'}
          </div>
          <div class="mono" style="font-size:12px;color:var(--muted);margin-bottom:12px">${esc(a.base_path)}</div>
          <div class="row">
            <button class="btn sm" onclick="openDocs('${esc(a.slug)}')">View docs</button>
            <button class="btn ghost sm" onclick="openPlayground('${esc(a.slug)}')">Try it</button>
          </div>
        </div>`).join("")}</div>`
      : `<div class="card empty">No APIs published yet.</div>`}`;
  }catch(e){
    $("app").innerHTML = `<div class="card empty">Could not load catalog: ${esc(e.message)}</div>`;
  }
}

function openDocs(slug){ state.docSlug = slug; go("docs"); }
function openPlayground(slug){ state.pgApi = slug; go("playground"); }

/* ------------------------------------------------------------------ docs */
async function viewDocs(){
  const cat = state.cache.catalog || await call("publicCatalog", {});
  state.cache.catalog = cat;
  const slug = state.docSlug || (cat.apis[0] && cat.apis[0].slug);
  if (!slug){ $("app").innerHTML = `<div class="card empty">No published APIs yet.</div>`; return; }
  state.docSlug = slug;
  let d;
  try{ d = await call("apiDocs", { api_slug: slug }); }
  catch(e){ $("app").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  const a = d.api;
  $("app").innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <h1>${esc(a.name)}</h1>
        <p class="lead">${esc(a.description)}</p>
      </div>
      <select style="max-width:230px" onchange="state.docSlug=this.value;go('docs')">
        ${cat.apis.map(x => `<option value="${esc(x.slug)}" ${x.slug===slug?"selected":""}>${esc(x.name)}</option>`).join("")}
      </select>
    </div>

    <div class="grid g3" style="margin-top:18px">
      <div class="card stat"><div class="label">Version</div><div class="value">${esc(a.version)}</div></div>
      <div class="card stat"><div class="label">Rate limit</div><div class="value">${num(a.default_rate_limit_per_minute)}<span style="font-size:12px;color:var(--muted)">/min</span></div></div>
      <div class="card stat"><div class="label">Daily quota</div><div class="value">${num(a.default_daily_quota)}</div></div>
    </div>

    <h2>Authentication</h2>
    <div class="card">
      <p>${d.authentication.type === "none" ? "This API is open and requires no key." :
        "Send your secret key in the <code>X-Api-Key</code> header. Keys are shown once at creation time and stored only as a SHA-256 hash."}</p>
      <h3>Gateway URL</h3>
      <pre>${esc(d.authentication.gateway_url)}</pre>
      <h3>Example request</h3>
      <pre>curl -X POST '${esc(d.authentication.gateway_url)}' \\
  -H 'X-Api-Key: $API_KEY' \\
  -H 'Content-Type: application/json' \\
  -d '{"api":"${esc(a.slug)}","endpoint":"${esc((d.endpoints[0]||{}).slug||"")}","body":{}}'</pre>
    </div>

    <h2>Endpoints <span class="pill muted">${d.endpoints.length}</span></h2>
    ${d.endpoints.map(ep => `
      <details>
        <summary><span class="method m-${esc(ep.method)}">${esc(ep.method)}</span>
          <code style="background:none;padding:0">${esc(ep.path)}</code>
          <span class="pill muted" style="margin-left:auto">${esc(ep.name)}</span></summary>
        <p style="margin-top:12px">${esc(ep.summary || ep.description || "")}</p>
        ${ep.parameters && ep.parameters.length ? `
          <h3>Parameters</h3>
          <table><thead><tr><th>Name</th><th>In</th><th>Type</th><th>Required</th><th>Description</th></tr></thead>
          <tbody>${ep.parameters.map(p => `<tr><td class="mono">${esc(p.name)}</td><td>${esc(p.in||"body")}</td>
            <td>${esc(p.type||"string")}</td><td>${p.required?"yes":"no"}</td><td>${esc(p.description||"")}</td></tr>`).join("")}</tbody></table>` : ""}
        ${ep.request_body_example && Object.keys(ep.request_body_example).length ? `
          <h3>Example body</h3><pre>${esc(JSON.stringify(ep.request_body_example,null,2))}</pre>` : ""}
        ${ep.response_examples && ep.response_examples.length ? ep.response_examples.map(r => `
          <h3>Response ${esc(r.status)}${r.description?" — "+esc(r.description):""}</h3>
          <pre>${esc(JSON.stringify(r.body,null,2))}</pre>`).join("") : ""}
        <div class="row" style="margin-top:12px">
          <button class="btn sm" onclick="openPlayground('${esc(a.slug)}','${esc(ep.slug)}')">Open in playground</button>
        </div>
      </details>`).join("")}`;
}

/* ------------------------------------------------------------------ auth */
function viewAuth(){
  $("app").innerHTML = `
    <div class="auth-wrap">
      <div class="card">
        <div class="tabs">
          <button class="${state.authTab!=="register"?"active":""}" onclick="openAuth('login')">Sign in</button>
          <button class="${state.authTab==="register"?"active":""}" onclick="openAuth('register')">Create account</button>
        </div>
        <div id="authForm"></div>
      </div>
    </div>`;
  renderAuthForm();
}

function renderAuthForm(){
  const reg = state.authTab === "register";
  $("authForm").innerHTML = `
    ${reg ? `<label>Full name</label><input id="a_name" placeholder="Ada Lovelace" autocomplete="name">` : ""}
    <label>Email</label><input id="a_email" type="email" placeholder="you@company.com" autocomplete="email">
    <label>Password</label><input id="a_pass" type="password" placeholder="At least 8 characters" autocomplete="${reg?"new-password":"current-password"}">
    ${reg ? `<label>Company <span style="opacity:.6">(optional)</span></label><input id="a_company" placeholder="Acme Inc">` : ""}
    <div style="margin-top:16px"><button class="btn" style="width:100%" id="a_btn" onclick="submitAuth()">
      ${reg ? "Create account" : "Sign in"}</button></div>
    <p class="hint">${reg ? "You get 60 requests/minute and 10,000 requests/day on the free plan."
      : "Sessions last 7 days. Passwords are hashed with PBKDF2-SHA256."}</p>`;
}

async function submitAuth(){
  const reg = state.authTab === "register";
  const email = $("a_email").value.trim(), password = $("a_pass").value;
  const btn = $("a_btn"); btn.disabled = true;
  try{
    const d = await call(reg ? "devRegister" : "devLogin", {
      email, password,
      full_name: reg ? ($("a_name").value.trim()) : undefined,
      company: reg ? ($("a_company").value.trim()) : undefined,
    });
    state.token = d.token; localStorage.setItem(TOKEN_KEY, d.token);
    state.dev = d.developer;
    state.authTab = "login";
    toast(reg ? "Account created" : "Signed in", "ok");
    go("dashboard");
  }catch(e){
    toast(e.message, "err");
  }finally{ btn.disabled = false; }
}

/* ------------------------------------------------------------------ dashboard */
async function viewDashboard(){
  if (!state.dev){ return viewAuth(); }
  let keys = [], me;
  try{
    me = await call("devSession", { action: "me" });
    state.dev = me.developer; state.overview = me.overview;
    keys = (await call("keyManage", { action: "list" })).keys || [];
  }catch(e){
    $("app").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return;
  }
  const o = me.overview;
  $("app").innerHTML = `
    <h1>Welcome back, ${esc((state.dev.full_name||state.dev.email).split(" ")[0])}</h1>
    <p class="lead">${esc(state.dev.plan)} plan · ${num(state.dev.rate_limit_per_minute)} requests/min ·
      ${num(state.dev.daily_quota)} requests/day</p>

    <div class="grid g4" style="margin-top:18px">
      <div class="card stat"><div class="label">Active keys</div><div class="value">${num(o.active_keys)}</div><div class="sub">of ${num(o.total_keys)} total</div></div>
      <div class="card stat"><div class="label">Requests today</div><div class="value">${num(o.requests_today_scanned)}</div><div class="sub">from recent traffic</div></div>
      <div class="card stat"><div class="label">Successful</div><div class="value" style="color:var(--ok)">${num(o.success_today_scanned)}</div><div class="sub">2xx/3xx</div></div>
      <div class="card stat"><div class="label">Failed</div><div class="value" style="color:var(--bad)">${num(o.failed_today_scanned)}</div><div class="sub">4xx/5xx</div></div>
    </div>

    <div class="section-head">
      <h2>API keys</h2>
      <button class="btn" onclick="createKeyPrompt()">Generate new key</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      ${keys.length ? `<table><thead><tr><th>Name</th><th>Key</th><th>Status</th><th>Keys used</th><th>Rate limit</th><th>Created</th><th></th></tr></thead>
      <tbody>${keys.map(k => `<tr>
        <td><strong>${esc(k.name)}</strong></td>

async function doCreateKey(){

    const d = await call("keyManage", {

function showSecret(secret){
  showModal(`<h2 style="margin-top:0">Your new API key</h2>

function copySecret(){
  const t = $("sec").textContent;
  navigator.clipboard.writeText(t).then(() => toast("Copied to clipboard", "ok"), () => toast("Copy failed", "err"));
}

async function revokeKey(id){
  if (!confirm("Revoke this key? Applications using it will immediately lose access.")) return;
  try{ await call("keyManage", { action: "revoke", key_id: id }); toast("Key revoked", "ok"); viewDashboard(); }
  catch(e){ toast(e.message, "err"); }
}
async function regenKey(id){
  if (!confirm("Rotate this key? The current secret stops working within a few seconds.")) return;
  try{
    const d = await call("keyManage", { action: "regenerate", key_id: id });
    showSecret(d.api_key); viewDashboard();
  }catch(e){ toast(e.message, "err"); }
}

async function viewHistory(){
  if (!state.dev) return viewAuth();
  let d;
  try{ d = await call("requestHistory", { limit: 50 }); }
  catch(e){ $("app").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  state.histCursor = d.next_cursor;
  $("app").innerHTML = `
    <h1>Request history</h1>
    <p class="lead">Every gateway call made with your keys, newest first.</p>
    <div class="row" style="margin:14px 0">
      <select id="hf" onchange="loadHistory(true)" style="max-width:190px">
        <option value="">All requests</option><option value="ok">Successful only</option><option value="fail">Failures only</option>
      </select>
      <button class="btn ghost sm" onclick="loadHistory(true)">Refresh</button>
    </div>
    <div class="card" style="padding:0;overflow:auto"><div id="histTable"></div></div>
    <div class="row" style="margin-top:14px;justify-content:center">
      <button class="btn ghost sm" id="moreBtn" onclick="loadHistory(false)" ${d.has_more?"":"style='display:none'"}>Load more</button>
    </div>`;
  renderHistRows(d.requests, false);
  state.histHasMore = d.has_more;
  $("moreBtn").style.display = d.has_more ? "" : "none";
}

function histRow(r){
  return `<tr>
    <td class="mono" style="font-size:11.5px;color:var(--muted);white-space:nowrap">${esc((r.timestamp||"").replace("T"," ").slice(0,19))}</td>
    <td><span class="method m-${esc(r.method)}">${esc(r.method)}</span></td>
    <td class="mono" style="font-size:12px">${esc(r.endpoint_path || "—")}</td>
    <td><span class="pill ${r.success?"ok":"bad"}">${esc(r.status_code)}</span></td>
    <td>${num(r.response_time_ms)}ms</td>
    <td style="font-size:12px;color:var(--muted)">${esc(r.error_code || "—")}</td>
    <td style="font-size:12px;color:var(--muted)">${esc(r.source || "api")}</td>
  </tr>`;
}

function renderHistRows(rows, append){
  const host = $("histTable");
  if (!host) return;
  if (!append){
    host.innerHTML = rows.length ? `<table><thead><tr><th>Time (UTC)</th><th>Method</th><th>Endpoint</th><th>Status</th><th>Latency</th><th>Error</th><th>Source</th></tr></thead><tbody id="histBody"></tbody></table>`
      : `<div class="empty">No requests recorded yet.</div>`;
  }
  const body = $("histBody");
  if (body) body.insertAdjacentHTML("beforeend", rows.map(histRow).join(""));
}

async function loadHistory(reset){
  const filter = $("hf") ? $("hf").value : "";
  const payload = { limit: 50 };
  if (filter === "ok") payload.success = true;
  if (filter === "fail") payload.success = false;
  if (!reset && state.histCursor) payload.cursor = state.histCursor;
  try{
    const d = await call("requestHistory", payload);
    renderHistRows(d.requests, !reset);
    state.histCursor = d.next_cursor;
    $("moreBtn").style.display = d.has_more ? "" : "none";
  }catch(e){ toast(e.message, "err"); }
}

async function viewPlayground(){
  let cat;

  const apis = cat.apis || [];

  const apiSlug = state.pgApi || (apis[0] && apis[0].slug);
  state.pgApi = apiSlug;
  const api = apis.find(a => a.slug === apiSlug) || apis[0];
  const eps = api.endpoints || [];
  const epSlug = state.pgEp || (eps[0] && eps[0].slug);
  state.pgEp = epSlug;
  const ep = eps.find(e => e.slug === epSlug) || eps[0];

  let keys = [];
  if (state.dev){ try{ keys = (await call("keyManage", { action: "list" })).keys.filter(k => k.status === "active"); }catch(e){} }

  $("app").innerHTML = `
    <h1>Testing playground</h1>
    <p class="lead">Requests are executed by the real gateway. Nothing here is simulated: the status, headers and body you see come back from the live API, and the call is recorded in your usage.</p>
    ${!state.dev ? `<div class="warnbox">You are not signed in. <a href="#" onclick="go('auth');return false">Sign in</a> to run authenticated requests.</div>` : ""}
    ${state.dev && !keys.length ? `<div class="warnbox">You have no active API key. <a href="#" onclick="go('dashboard');return false">Generate one</a> first.</div>` : ""}

    <div class="grid g2" style="margin-top:18px">
      <div class="card">
        <label>API</label>
        <select onchange="state.pgApi=this.value;state.pgEp=null;go('playground')">
          ${apis.map(a => `<option value="${esc(a.slug)}" ${a.slug===apiSlug?"selected":""}>${esc(a.name)}</option>`).join("")}
        </select>
        <label>Endpoint</label>
        <select onchange="state.pgEp=this.value;go('playground')">
          ${eps.map(e => `<option value="${esc(e.slug)}" ${e.slug===epSlug?"selected":""}>${esc(e.method)} ${esc(e.path)}</option>`).join("")}
        </select>
        ${state.dev ? `<label>API key</label>
        <select id="pg_key">${keys.map(k => `<option value="${esc(k.id)}">${esc(k.name)} · ${esc(k.masked_key)}</option>`).join("")}</select>` : ""}
        <label>Request body (JSON)</label>
        <textarea id="pg_body" placeholder='{"text":"hello world"}'>${esc(JSON.stringify(defaultBody(ep), null, 2))}</textarea>
        <div class="row" style="margin-top:14px">
          <button class="btn" id="pg_send" onclick="sendPlayground()">Send request</button>
          <span class="hint" style="margin:0">${esc(ep.method)} ${esc(ep.path)}</span>
        </div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <strong>Response</strong><span id="pg_meta" class="hint"></span>
        </div>
        <div id="pg_out"><div class="empty">Send a request to see the live response.</div></div>
      </div>
    </div>`;
}

function defaultBody(ep){
  if (ep.request_body_example && Object.keys(ep.request_body_example).length) return ep.request_body_example;
  if (ep.method === "GET") return {};
  return { text: "hello world" };
}

async function sendPlayground(){
  if (!state.dev){ toast("Sign in to run requests", "err"); return; }
  const btn = $("pg_send"); btn.disabled = true;
  $("pg_out").innerHTML = `<div class="empty">Executing against the live gateway…</div>`;
  try{
    let body = {};
    const raw = $("pg_body").value.trim();
    if (raw){ try{ body = JSON.parse(raw); }catch(e){ throw new Error("Request body is not valid JSON"); } }
    const d = await call("playgroundSend", {
      key_id: $("pg_key").value,
      api_slug: state.pgApi,
      endpoint_slug: state.pgEp,
      params: {}, body,
    });
    const r = d.response;
    $("pg_meta").textContent = `${r.status_code} · ${num(d.round_trip_ms)}ms · ${d.method} ${d.path}`;
    $("pg_out").innerHTML = `
      <div class="row" style="gap:8px;margin-bottom:10px">
        <span class="pill ${r.status_code<400?"ok":"bad"}">HTTP ${r.status_code}</span>
        <span class="pill muted">${num(d.round_trip_ms)}ms round trip</span>
        <span class="pill muted">via ${esc(d.executed_through)}</span>
      </div>
      <pre style="max-height:430px">${esc(JSON.stringify(r.body, null, 2))}</pre>`;
  }catch(e){
    $("pg_out").innerHTML = `<div class="card" style="border-color:#4b2333"><strong style="color:var(--bad)">${esc(e.message)}</strong></div>`;
    toast(e.message, "err");
  }finally{ btn.disabled = false; }
}

    <label>Summary</label><input id="ep_summary" placeholder="What this endpoint does">
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="ep_go" onclick="doCreateEndpoint('${esc(slug)}')">Create</button>
    </div>`);
}

async function doCreateEndpoint(slug){
  const btn = $("ep_go"); btn.disabled = true;
  try{
    await call("endpointManage", {
      action: "create", api_slug: slug,
      name: $("ep_name").value.trim(), method: $("ep_method").value,
      path: $("ep_path").value.trim(), handler_key: $("ep_handler").value,
      summary: $("ep_summary").value.trim(),
    });
    closeModal(); toast("Endpoint created", "ok"); viewEndpoints(slug);
  }catch(e){ toast(e.message, "err"); btn.disabled = false; }
}

async function toggleEndpoint(id, active){
  try{ await call("endpointManage", { action: "update", id, is_active: !active }); viewEndpoints(state.adminApis ? state.pgApiCursor || "" : ""); viewAdmin(); }
  catch(e){ toast(e.message, "err"); }
}
async function deleteEndpoint(id){
  if (!confirm("Delete this endpoint?")) return;
  try{ await call("endpointManage", { action: "delete", id }); toast("Endpoint deleted", "ok"); viewAdmin(); }
  catch(e){ toast(e.message, "err"); }
}
function categoryPrompt(){
  showModal(`<h2 style="margin-top:0">New category</h2>
    <label>Name</label><input id="cat_name" placeholder="Weather">
    <label>Description</label><input id="cat_desc" placeholder="Weather and climate data">
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="cat_go" onclick="doCreateCategory()">Create</button>
    </div>`);
}
async function doCreateCategory(){
  const btn = $("cat_go"); btn.disabled = true;
  try{
    await call("categoryManage", { action: "create", name: $("cat_name").value.trim(), description: $("cat_desc").value.trim() });
    closeModal(); toast("Category created", "ok"); viewAdmin();
  }catch(e){ toast(e.message, "err"); btn.disabled = false; }
}

/* ------------------------------------------------------------------ modal */
function showModal(html){
  $("modalRoot").innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card">${html}</div></div>`;
}
function closeModal(){ $("modalRoot").innerHTML = ""; }

/* ------------------------------------------------------------------ boot */
(async function boot(){
  await loadSession();
  go("catalog");
})();
</script>
</body>
</html>
