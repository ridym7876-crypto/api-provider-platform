<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MR RIDUY AI API — AI APIs for the web</title>
<meta name="description" content="Create AI APIs for your website, app or game. Chat, summarise, translate, sentiment and keyword extraction with a single key."/>
<style>
:root{
  --blue:#1a73e8; --blue-d:#1765cc; --blue-l:#e8f0fe;
  --text:#202124; --muted:#5f6368; --border:#dadce0; --bg:#fff; --bg2:#f8f9fa;
  --green:#188038; --red:#d93025; --amber:#f9ab00;
  --shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-lg:0 4px 6px rgba(60,64,67,.15),0 8px 24px rgba(60,64,67,.15);
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:400;letter-spacing:-.2px}
h1{font-size:44px;line-height:1.15;letter-spacing:-1px}
h2{font-size:22px}
h3{font-size:16px;font-weight:500}
p{margin:0}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--border)}
.hdr{max-width:1280px;margin:0 auto;height:64px;display:flex;align-items:center;gap:8px;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--text);letter-spacing:-.4px;cursor:pointer;font-weight:500}
.dots{display:inline-grid;grid-template-columns:8px 8px;gap:2px;transform:rotate(0)}
.dots i{width:8px;height:8px;border-radius:50%;display:block}
nav{display:flex;align-items:center;gap:2px;margin-left:24px;flex:1;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:0;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;
  padding:10px 12px;border-radius:4px;white-space:nowrap;position:relative;
}
nav button:hover{background:var(--bg2);color:var(--text)}
nav button.on{color:var(--blue);font-weight:500}
nav button.on:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--blue);border-radius:3px 3px 0 0}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;background:var(--blue-l);color:var(--blue-d);letter-spacing:.2px}
.pill.admin{background:#fef7e0;color:#b06000}
/* ---------- layout ---------- */
main{max-width:1280px;margin:0 auto;padding:0 24px 80px}
.hero{text-align:center;padding:88px 0 56px}
.hero p.sub{margin:18px auto 0;max-width:660px;font-size:18px;color:var(--muted);line-height:1.55}
.searchwrap{margin:36px auto 0;max-width:620px;position:relative}
.searchwrap svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);fill:#9aa0a6}
.searchwrap input{
  width:100%;height:52px;border:1px solid var(--border);border-radius:26px;padding:0 20px 0 52px;
  font:inherit;font-size:16px;outline:none;background:#fff;transition:box-shadow .15s,border-color .15s;
}
.searchwrap input:hover{box-shadow:var(--shadow)}
.searchwrap input:focus{border-color:transparent;box-shadow:var(--shadow-lg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0 0}
.chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.chip:hover{background:var(--bg2)}
.chip.on{background:var(--blue-l);border-color:var(--blue-l);color:var(--blue-d);font-weight:500}
.section{margin:40px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.section-head .title{font-size:20px;font-weight:500;letter-spacing:-.3px}
.section-head .meta{font-size:13px;color:var(--muted);margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{border:1px solid var(--border);border-radius:12px;padding:20px;background:#fff;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--shadow)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{font-size:17px;font-weight:500;color:var(--text);letter-spacing:-.2px}
.card .desc{color:var(--muted);font-size:13px;line-height:1.55;flex:1}
.card .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--muted);background:var(--bg2);border-radius:4px;padding:3px 8px}
.mono{font-family:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:4px}
/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;
  border-radius:4px;border:1px solid transparent;background:var(--blue);color:#fff;font:inherit;font-size:14px;
  font-weight:500;cursor:pointer;letter-spacing:.2px;white-space:nowrap;
}
.btn:hover{background:var(--blue-d);box-shadow:var(--shadow)}
.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.btn.ghost{background:none;color:var(--blue);border-color:var(--border)}
.btn.ghost:hover{background:var(--blue-l);border-color:var(--blue-l);box-shadow:none}
.btn.grey{background:#fff;color:var(--text);border-color:var(--border)}
.btn.grey:hover{background:var(--bg2);box-shadow:none}
.btn.danger{background:none;color:var(--red);border-color:var(--border)}
.btn.danger:hover{background:#fce8e6;border-color:#fce8e6;box-shadow:none}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{
  border:1px solid var(--border);border-radius:4px;padding:10px 12px;font:inherit;font-size:14px;
  outline:none;background:#fff;color:var(--text);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.field textarea{font-family:'Roboto Mono',ui-monospace,Menlo,monospace;font-size:13px;resize:vertical;min-height:120px}
.hint{font-size:12px;color:var(--muted)}
/* ---------- panels / tables ---------- */
.panel{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.panel .ph{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel .pb{padding:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:500;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2)}
td{padding:14px 20px;border-bottom:1px solid #f1f3f4;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafafa}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.stat{border:1px solid var(--border);border-radius:12px;padding:18px 20px;background:#fff}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.stat .v{font-size:28px;margin-top:6px;letter-spacing:-.5px}
.bar{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.center{text-align:center}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.ok{color:var(--green);font-weight:500}
.bad{color:var(--red);font-weight:500}
pre.code{background:#202124;color:#e8eaed;border-radius:8px;padding:16px;overflow:auto;font-family:'Roboto Mono',ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6;margin:0}
pre.code.sm{font-size:12px}
.grid2{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
.sidelist{border:1px solid var(--border);border-radius:12px;overflow:hidden;position:sticky;top:88px}
.sidelist button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #f1f3f4;padding:12px 16px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.sidelist button:hover{background:var(--bg2)}
.sidelist button.on{background:var(--blue-l);color:var(--blue-d);font-weight:500}
.doc-ep{border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px;background:#fff}
.method{font-family:'Roboto Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:4px;background:var(--blue-l);color:var(--blue-d)}
.method.post{background:#e6f4ea;color:#137333}
/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(32,33,36,.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:600px;max-height:88vh;overflow:auto}
.modal .mh{padding:20px 24px;border-bottom:1px solid var(--border);font-size:18px}
.modal .mb{padding:24px}
.modal .mf{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.keybox{border:1px dashed var(--blue);background:var(--blue-l);border-radius:8px;padding:14px;font-family:'Roboto Mono',monospace;font-size:13px;word-break:break-all;color:var(--blue-d)}
.brandkey{font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.6px;text-transform:uppercase;font-weight:500}
#toast{position:fixed;left:24px;bottom:24px;background:#323232;color:#fff;padding:12px 18px;border-radius:6px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:80;max-width:380px}
#toast.show{opacity:1;transform:none}
footer{border-top:1px solid var(--border);padding:28px 24px;color:var(--muted);font-size:13px}
footer .in{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.sidelist{position:static}h1{font-size:32px}.hero{padding:56px 0 40px}}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <div class="brand" onclick="go('catalog')">
      <span class="dots"><i style="background:#4285f4"></i><i style="background:#ea4335"></i><i style="background:#fbbc05"></i><i style="background:#34a853"></i></span>
      <span>MR RIDUY <span style="color:var(--muted);font-weight:400">AI API</span></span>
    </div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </div>
</header>
<main id="app"></main>
<footer><div class="in"><span>MR RIDUY AI API · AI APIs for websites, apps and games &middot; build b3</span><span id="footright">Gateway: /functions/apiGateway</span></div></footer>
<div id="modals"></div>
<div id="toast"></div>

<script>
const BASE = "https://superagent-b31b88fd.base44.app/functions";
const TOKEN_KEY = "mr_riduy_token";
const state = {
  view: "catalog", token: localStorage.getItem(TOKEN_KEY) || "", dev: null,
  catalog: null, docs: null, docSlug: null, authTab: "login",
  filter: "", catFilter: "", keys: [], overview: null,
  pgApi: "", pgEp: "", pgBody: "{\n  \"message\": \"Hello from my website\"\n}", pgKeyId: "", pgResult: null,
  usage: null, history: null, adminApis: [], adminCats: [], adminEps: [], adminSlug: "",
  keyModal: null, busy: false
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = (o, ...ks) => { for (const k of ks) { if (o && o[k] !== undefined && o[k] !== null) return o[k]; } return undefined; };
const num = (v, d = 0) => (typeof v === "number" ? v : (Number(v) || d));
const pct = (v) => (v === undefined || v === null ? "—" : (Number(v) <= 1 ? (Number(v) * 100).toFixed(1) : Number(v).toFixed(1)) + "%");

function toast(msg, kind) {
  const t = $("toast");
  t.textContent = msg;
  t.style.background = kind === "bad" ? "#d93025" : (kind === "ok" ? "#188038" : "#323232");
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 3600);
}

const MEMO = new Map();
const MEMO_TTL = 45000;

async function call(fn, payload = {}, extraHeaders = {}) {
  const memoKey = fn + "|" + JSON.stringify(payload);
  const isRead = !payload || !payload.action || payload.action === "list" || payload.action === "get";
  if (isRead) {
    const hit = MEMO.get(memoKey);
    if (hit && Date.now() - hit.at < MEMO_TTL) return hit.val;
  }
  const headers = { "Content-Type": "application/json", ...extraHeaders };
  if (state.token && !headers["X-Developer-Token"]) headers["X-Developer-Token"] = state.token;
  let res, body = {};
  try {
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const tid = ctrl ? setTimeout(() => ctrl.abort(), 25000) : null;
    try {
      res = await fetch(BASE + "/" + fn, { method: "POST", headers, body: JSON.stringify(payload), signal: ctrl ? ctrl.signal : undefined });
    } finally { if (tid) clearTimeout(tid); }
    const text = await res.text();
    try { body = text ? JSON.parse(text) : {}; } catch (_) { body = { raw: text }; }
  } catch (e) {
    const aborted = e && e.name === "AbortError";
    return { status: 0, body: { ok: false, error: { code: aborted ? "timeout" : "network",
      message: aborted ? "The server took too long to respond. Please press the button again." : "Network error: " + e.message } } };
  }
  const action = payload && payload.action;
  if (isRead && res.status < 400) MEMO.set(memoKey, { val: { status: res.status, body }, at: Date.now() });
  if (res.status < 300 && typeof action === "string" && MUTATIONS.test(action)) { MEMO.clear(); scheduleRefresh(); }
  return { status: res.status, body };
}

/* A write is not instantly visible everywhere; refresh twice so new rows appear. */
const MUTATIONS = /^(create|update|delete|set_status|revoke|regenerate)$/;
let refreshTimers = [];
function scheduleRefresh() {
  refreshTimers.forEach(clearTimeout);
  refreshTimers = [setTimeout(refreshCurrent, 1400)];
}
function refreshCurrent() {
  if (state.view === "admin") loadAdmin();
  else if (state.view === "dashboard") loadDashboard();
}

/* ---------------- navigation ---------------- */
const NAV = [
  ["catalog", "API Catalog"], ["docs", "Documentation"], ["playground", "Playground"],
  ["dashboard", "Console"], ["usage", "Usage"], ["requests", "Requests"]
];

function renderNav() {
  const items = NAV.slice();
  if (state.dev && state.dev.role === "admin") items.push(["admin", "Admin"]);
  $("nav").innerHTML = items.map(([id, label]) =>
    `<button class="${state.view === id ? "on" : ""}" onclick="go('${id}')">${label}</button>`).join("");

  if (state.dev) {
    $("who").innerHTML = `<span>${esc(state.dev.email)}</span>
      <span class="pill ${state.dev.role === "admin" ? "admin" : ""}">${esc(state.dev.role)}</span>
      <button class="btn grey sm" onclick="logout()">Sign out</button>`;
  } else {
    $("who").innerHTML = `<button class="btn ghost sm" onclick="openAuth('login')">Sign in</button>
      <button class="btn sm" onclick="openAuth('register')">Get API key</button>`;
  }
}

function go(view) {
  state.view = view;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openAuth(tab) { state.authTab = tab; go("auth"); }

async function boot() {
  renderNav();
  if (state.token) {
    const { status, body } = await call("devSession", { action: "me" });
    if (status === 200) { state.dev = body.data.developer; state.overview = body.data.overview; }
    else if (status === 401) { state.token = ""; localStorage.removeItem(TOKEN_KEY); state.dev = null; }
    else { toast("Could not reach the server just now. Refresh in a few seconds.", "bad"); }
  }
  renderNav();
  go(state.view);
}

function render() {
  renderNav();
  const app = $("app");
  const v = {
    catalog: viewCatalog, docs: viewDocs, playground: viewPlayground, auth: viewAuth,
    dashboard: viewDashboard, usage: viewUsage, requests: viewRequests, admin: viewAdmin
  }[state.view] || viewCatalog;
  app.innerHTML = v();
  if (state.view === "catalog") bindCatalog();
}

/* ---------------- catalog ---------------- */
function viewCatalog() {
  const cat = state.catalog;
  if (!cat) { loadCatalog(); return `<div class="empty">Loading catalog…</div>`; }
  const totals = cat.totals || {};
  const apis = (cat.apis || []).filter((a) => {
    const q = state.filter.toLowerCase();
    const okQ = !q || (a.name + " " + a.description + " " + a.slug).toLowerCase().includes(q);
    const okC = !state.catFilter || a.category_slug === state.catFilter || a.category === state.catFilter;
    return okQ && okC;
  });
  const cards = apis.map((a) => {
    const isAI = /ai/i.test(a.slug) || !!a.is_ai;
    return `<div class="card">
      <div class="top"><h3>${esc(a.name)}</h3><span class="tag">${esc(a.version || "v1")}</span></div>
      <div class="desc">${esc(a.description || "")}</div>
      <div class="row">
        <span class="tag">${esc(a.category_slug || a.category || "general")}</span>
        <span class="tag">${num(pick(a, "endpoint_count", "endpoints_total", "endpoints") || (a.endpoints && a.endpoints.length))} endpoints</span>
        ${isAI ? `<span class="pill">AI</span>` : ``}
      </div>
      <div class="mono">${esc(a.base_path || "")}</div>
      <div class="actions">
        <button class="btn ghost sm" onclick="openDoc('${esc(a.slug)}')">Docs</button>
        <button class="btn grey sm" onclick="tryApi('${esc(a.slug)}')">Try it</button>
      </div>
    </div>`;
  }).join("");

  return `
  <section class="hero">
    <h1>AI APIs for your website, app or game</h1>
    <p class="sub">Generate a key in seconds and call chat, summarise, translate, sentiment and keyword endpoints from any stack. Every response you see here is produced live.</p>
    <div class="searchwrap">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" placeholder="Search APIs — chat, translate, sentiment…" value="${esc(state.filter)}"/>
    </div>
    <div class="chips">
      <button class="chip ${!state.catFilter ? "on" : ""}" onclick="setCat('')">All</button>
      ${(cat.categories || []).map((c) => `<button class="chip ${state.catFilter === c.slug ? "on" : ""}" onclick="setCat('${esc(c.slug)}')">${esc(c.name)}</button>`).join("")}
    </div>
  </section>
  <section class="section">
    <div class="section-head">
      <div><div class="title">Published APIs</div>
      <div class="meta">${num(totals.apis, apis.length)} APIs · ${num(totals.endpoints)} endpoints · ${num(totals.categories)} categories</div></div>
      <button class="btn ghost sm" onclick="loadCatalog()">Refresh</button>
    </div>
    <div class="cards">${cards || `<div class="empty">No API matches that search.</div>`}</div>
  </section>`;
}

function bindCatalog() {
  const q = $("q");
  if (q) q.addEventListener("input", (e) => {
    state.filter = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const nq = $("q"); if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); }
  });
}

function setCat(slug) { state.catFilter = slug; render(); }

async function loadCatalog() {
  const { status, body } = await call("publicCatalog", {});
  if (status === 200) state.catalog = body.data;
  else toast((body.error && body.error.message) || "Could not load catalog", "bad");
  render();
}

function openDoc(slug) { state.docSlug = slug; state.docs = null; go("docs"); }
function tryApi(slug) {
  state.pgApi = slug; state.pgEp = ""; state.pgResult = null;
  go("playground");
}

/* ---------------- docs ---------------- */
function viewDocs() {
  const cat = state.catalog;
  if (!cat) { loadCatalog(); return `<div class="empty">Loading…</div>`; }
  const slug = state.docSlug || (cat.apis[0] && cat.apis[0].slug);
  if (!state.docs && slug) loadDoc(slug);
  const list = (cat.apis || []).map((a) =>
    `<button class="${a.slug === slug ? "on" : ""}" onclick="openDoc('${esc(a.slug)}')">${esc(a.name)}</button>`).join("");
  if (!state.docs) return `<div class="section grid2"><div class="sidelist">${list}</div><div class="empty">Loading documentation…</div></div>`;

  const d = state.docs;
  const api = d.api || {};
  const auth = d.authentication || {};
  const eps = d.endpoints || [];
  const gw = d.gateway_url || (BASE + "/apiGateway");
  const epCards = eps.map((e) => {
    const params = (e.parameters || []).map((p) =>
      `<tr><td class="mono">${esc(p.name)}</td><td>${esc(p.in || "body")}</td><td>${esc(p.type || "")}</td><td>${p.required ? "yes" : "no"}</td><td>${esc(p.description || "")}</td></tr>`).join("");
    const example = `curl -X ${esc(e.method)} '${gw}' \\
  -H 'X-Api-Key: mr_riduy_ai_YOUR_KEY' \\

async function submitAuth(reg) {
  const email = ($("a_email") || {}).value || "";
  const pass = ($("a_pass") || {}).value || "";
  if (!email || !pass) return toast("Email and password are required", "bad");
  const payload = reg
    ? { email, password: pass, full_name: ($("a_name") || {}).value || "", company: ($("a_company") || {}).value || "" }
    : { email, password: pass };
  const btn = $("a_btn"); if (btn) { btn.disabled = true; btn.textContent = "Please wait…"; }
  const { status, body } = await call(reg ? "devRegister" : "devLogin", payload);
  if (btn) { btn.disabled = false; }
  if (status >= 200 && status < 300 && body.data && body.data.token) {
    state.token = body.data.token;
    localStorage.setItem(TOKEN_KEY, state.token);
    state.dev = body.data.developer;
    state.authTab = "login";
    toast(reg ? "Account created. Generate your first key." : "Signed in", "ok");
    go("dashboard");
  } else {
    toast((body.error && body.error.message) || "Authentication failed", "bad");
    if (btn) btn.textContent = reg ? "Create account" : "Sign in";
  }
}

function revealKey(secret, extra) {

async function createKey() {
  if (!state.token) { closeModal(); toast("Please sign in first, then generate a key.", "bad"); go("auth"); return; }
  const name = ($("k_name") || {}).value || "Default key";
  const btn = $("k_go"); if (btn) { btn.disabled = true; btn.textContent = "Generating…"; }
  let r = await call("keyManage", { action: "create", name });
  const m0 = (r.body && r.body.error && r.body.error.message) || "";
  if (r.status >= 500 && /capacity|allows \d+ requests|rate limit/i.test(m0)) {
    await new Promise((z) => setTimeout(z, 1500));
    r = await call("keyManage", { action: "create", name });
  }
  const status = r.status, body = r.body || {};
  if (status === 201 && body.data && body.data.api_key) {
    MEMO.clear(); state.keys = []; closeModal(); revealKey(body.data.api_key, body.data.warning);
    await loadDashboard();
  } else {
    if (btn) { btn.disabled = false; btn.textContent = "Generate"; }
    const msg = (body.error && body.error.message) || body.message || body.detail || ("Key creation failed (HTTP " + status + ")");
    toast(msg, "bad");
    if (status === 401 || status === 403) { state.token = ""; localStorage.removeItem(TOKEN_KEY); state.dev = null; go("auth"); }
  }
}

async function revokeKey(id) {
  const { status, body } = await call("keyManage", { action: "revoke", key_id: id });
  toast(status === 200 ? "Key revoked" : ((body.error && body.error.message) || "Failed"), status === 200 ? "ok" : "bad");
  await loadDashboard();
}

async function rotateKey(id) {
  const { status, body } = await call("keyManage", { action: "regenerate", key_id: id });
  if (status === 201) { revealKey(body.data.api_key, body.data.warning); await loadDashboard(); }
  else toast((body.error && body.error.message) || "Could not rotate", "bad");
}

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => toast("Copied", "ok")).catch(() => toast("Copy failed", "bad"));

  const epOpts = eps.map((e) => `<option value="${esc(e.slug)}" ${e.slug === state.pgEp ? "selected" : ""}>${esc(e.method)} ${esc(e.path)}</option>`).join("");
  const keyOpts = (state.keys || []).filter((k) => k.status === "active")
    .map((k) => `<option value="${esc(k.id)}" ${k.id === state.pgKeyId ? "selected" : ""}>${esc(k.name)} · ${esc(k.masked_key)}</option>`).join("");

  return `<section class="section">

      <div class="meta">Requests are executed by the live gateway. Nothing is simulated, and every call is recorded in your usage.</div></div></div>

    <div class="grid2" style="grid-template-columns:1fr 1fr">
      <div class="panel"><div class="pb">
        <div class="field"><label>API</label><select id="pg_api" onchange="pgSetApi(this.value)">${apiOpts}</select></div>
        <div class="field"><label>Endpoint</label><select id="pg_ep" onchange="state.pgEp=this.value;render()">${epOpts}</select></div>
        <div class="field"><label>API key</label><select id="pg_key" onchange="state.pgKeyId=this.value">${keyOpts || `<option value="">No active key</option>`}</select></div>
        <div class="field"><label>Request body (JSON)</label><textarea id="pg_body">${esc(state.pgBody)}</textarea></div>
        <button class="btn" id="pg_send" onclick="sendPlayground()">Send request</button>
      </div></div>
      <div class="panel">
        <div class="ph"><h3>Response</h3>${r ? `<span class="hint">${esc(r.status)} · ${esc(r.ms)}ms</span>` : ""}</div>
        <div class="pb">${r ? `<pre class="code">${esc(r.body)}</pre>` : `<p class="hint">Send a request to see the live response.</p>`}</div>
      </div>

}

function pgSetApi(slug) {
  state.pgApi = slug; state.pgEp = ""; state.pgResult = null;
  const api = ((state.catalog || {}).apis || []).find((a) => a.slug === slug);
  const first = api && api.endpoints && api.endpoints[0];
  if (first) {
    state.pgEp = first.slug;
    if (slug === "ai") state.pgBody = "{\n  \"message\": \"Hello from my website\"\n}";
  }
  render();
}

async function sendPlayground() {
  const bodyText = ($("pg_body") || {}).value || "{}";
  let parsed;
  try { parsed = JSON.parse(bodyText || "{}"); }
  catch (e) { return toast("Request body is not valid JSON", "bad"); }
  if (!state.pgKeyId) return toast("Create an API key first", "bad");
  const btn = $("pg_send"); if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
  const t0 = performance.now();
  const { status, body } = await call("playgroundSend", {
    key_id: state.pgKeyId, api_slug: state.pgApi, endpoint_slug: state.pgEp, body: parsed
  });
  const ms = Math.round(performance.now() - t0);
  if (btn) { btn.disabled = false; btn.textContent = "Send request"; }
  if (status === 200) {
    const resp = (body.data && body.data.response) || {};
    const code = pick(resp, "status_code", "status") || (body.data && body.data.status_code) || 0;
    state.pgResult = { status: code, ms: pick(body.data, "round_trip_ms") || ms, body: JSON.stringify(pick(resp, "body") || resp, null, 2) };
    render();
    await loadDashboard();
  } else {
    const code = (body.error && body.error.code) || "";
    const msg = code === "platform_capacity"
      ? "The platform is momentarily at its request ceiling. Wait a few seconds and press Send again."
      : ((body.error && body.error.message) || "Request failed");
    state.pgResult = { status: status, ms: ms, body: JSON.stringify({ error: code || "error", message: msg }, null, 2) };
    render();
  }
}

    <td>${esc(a.category_slug || "—")}</td>
    <td>${num(pick(a, "endpoint_count"), 0)}</td>
    <td><span class="pill ${a.status === "active" ? "" : "admin"}">${esc(a.status)}</span></td>
    <td style="white-space:nowrap">
      <button class="btn ghost sm" onclick="adminEndpoints('${esc(a.slug)}')">Endpoints</button>
      <button class="btn grey sm" onclick="toggleApi('${esc(a.slug)}','${a.status === "active" ? "inactive" : "active"}')">${a.status === "active" ? "Deactivate" : "Activate"}</button>
      <button class="btn danger sm" onclick="deleteApi('${esc(a.slug)}')">Delete</button>
    </td></tr>`).join("");
  const catRows = cats.map((c) => `<tr><td>${esc(c.name)}<div class="hint">${esc(c.description || "")}</div></td>
    <td class="mono">${esc(c.slug)}</td><td>${num(pick(c, "api_count"))}</td>
    <td><span class="pill ${c.is_active === false ? "admin" : ""}">${c.is_active === false ? "hidden" : "live"}</span></td></tr>`).join("");
  const eps = (state.adminEps || []).map((e) => `<tr>
    <td><span class="method ${String(e.method).toLowerCase()}">${esc(e.method)}</span></td>
    <td class="mono">${esc(e.path)}</td>
    <td class="mono">${esc(e.handler_key || "—")}</td>
    <td>${num(e.rate_limit_override) || "—"}</td>
    <td><span class="pill ${e.is_active === false ? "admin" : ""}">${e.is_active === false ? "off" : "on"}</span></td>
    <td><button class="btn danger sm" onclick="deleteEndpoint('${esc(e.id)}')">Delete</button></td></tr>`).join("");

  return `<section class="section">
    <div class="section-head"><div><div class="title">API management</div>
      <div class="meta">Changes reach the gateway within about 30 seconds.</div></div>
      <div style="display:flex;gap:8px"><button class="btn grey sm" onclick="newCategory()">New category</button><button class="btn sm" onclick="newApi()">New API</button></div></div>
    <div class="panel" style="margin-bottom:24px"><div class="ph"><h3>API products</h3><span class="hint">${apis.length} total</span></div>
      ${rows ? `<table><thead><tr><th>Name</th><th>Slug</th><th>Category</th><th>Endpoints</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">No APIs</div>`}</div>
    <div class="panel" style="margin-bottom:24px"><div class="ph"><h3>Categories</h3></div>
      ${catRows ? `<table><thead><tr><th>Name</th><th>Slug</th><th>APIs</th><th>State</th></tr></thead><tbody>${catRows}</tbody></table>` : `<div class="empty">No categories</div>`}</div>
    ${state.adminSlug ? `<div class="panel"><div class="ph"><h3>Endpoints · ${esc(state.adminSlug)}</h3>
      <button class="btn sm" onclick="newEndpoint()">New endpoint</button></div>
      ${eps ? `<table><thead><tr><th>Method</th><th>Path</th><th>Handler</th><th>Override</th><th>State</th><th></th></tr></thead><tbody>${eps}</tbody></table>` : `<div class="empty">No endpoints</div>`}</div>` : ""}
  </section>`;
}

async function loadAdmin() {
  if (!state.dev || state.dev.role !== "admin") return;
  const [a, c] = await Promise.all([call("apiManage", { action: "list", include_all: true }), call("categoryManage", { action: "list" })]);
  if (a.status === 200) state.adminApis = a.body.data.apis || [];
  if (c.status === 200) state.adminCats = c.body.data.categories || [];
  if (state.adminSlug) {
    const e = await call("endpointManage", { action: "list", api_slug: state.adminSlug });
    if (e.status === 200) state.adminEps = e.body.data.endpoints || [];
  }
  if (state.view === "admin") render();
}

function adminEndpoints(slug) { state.adminSlug = slug === state.adminSlug ? "" : slug; state.adminEps = []; render(); }

async function toggleApi(slug, status) {
  const { status: st, body } = await call("apiManage", { action: "set_status", slug, status });
  toast(st === 200 ? "Status updated" : ((body.error && body.error.message) || "Failed"), st === 200 ? "ok" : "bad");
  await loadAdmin();
}

async function deleteApi(slug) {
  if (!confirm("Delete " + slug + " and all of its endpoints?")) return;
  const { status, body } = await call("apiManage", { action: "delete", slug });
  toast(status === 200 ? "API deleted" : ((body.error && body.error.message) || "Failed"), status === 200 ? "ok" : "bad");
  state.adminSlug = ""; await loadAdmin();
}

async function deleteEndpoint(id) {
  if (!confirm("Delete this endpoint?")) return;
  const { status, body } = await call("endpointManage", { action: "delete", endpoint_id: id, id });
  toast(status === 200 ? "Endpoint deleted" : ((body.error && body.error.message) || "Failed"), status === 200 ? "ok" : "bad");
  await loadAdmin();
}

function newApi() {
  const cats = (state.adminCats || []).map((c) => `<option value="${esc(c.slug)}">${esc(c.name)}</option>`).join("");
  openModal(`<div class="mh">New API product</div><div class="mb">
    <div class="field"><label>Name</label><input id="n_name" placeholder="Image Tools API"/></div>
    <div class="field"><label>Slug</label><input id="n_slug" placeholder="image"/></div>
    <div class="field"><label>Description</label><input id="n_desc" placeholder="What this API does"/></div>
    <div class="field"><label>Category</label><select id="n_cat">${cats}</select></div>
    <div class="field"><label>Base path</label><input id="n_base" placeholder="/v1/image"/></div>
    <div class="field"><label>Requests per minute</label><input id="n_rl" value="60"/></div>
  </div><div class="mf"><button class="btn grey" onclick="closeModal()">Cancel</button><button class="btn" onclick="createApi()">Create</button></div>`);
}

function friendly(body) {
  const e = (body && body.error) || {};
  if (e.code === "platform_capacity" || /allows \d+ requests per|rate limit exceeded/i.test(e.message || "")) return "Platform busy - please try again in a few seconds.";
  return e.message || "Failed";
}

async function createApi() {
  const payload = {
    action: "create",
    name: ($("n_name") || {}).value, slug: ($("n_slug") || {}).value,
    description: ($("n_desc") || {}).value, category_slug: ($("n_cat") || {}).value,
    base_path: ($("n_base") || {}).value, default_rate_limit_per_minute: Number(($("n_rl") || {}).value || 60),
    status: "active", auth_required: true, is_public: true
  };
  const { status, body } = await call("apiManage", payload);
  if (status === 201) {
    const created = (body.data && body.data.api) || null;
    if (created) { created.endpoint_count = created.endpoint_count || 0; state.adminApis = (state.adminApis || []).concat([created]); }
    closeModal(); toast("API created", "ok"); render();
    await loadAdmin(); refreshSoon();
  } else toast(friendly(body), "bad");
}

function newCategory() {
  openModal(`<div class="mh">New category</div><div class="mb">
    <div class="field"><label>Name</label><input id="c_name" placeholder="Finance"/></div>
    <div class="field"><label>Slug</label><input id="c_slug" placeholder="finance"/></div>
    <div class="field"><label>Description</label><input id="c_desc"/></div>
  </div><div class="mf"><button class="btn grey" onclick="closeModal()">Cancel</button><button class="btn" onclick="createCategory()">Create</button></div>`);
}

async function createCategory() {
  const { status, body } = await call("categoryManage", {
    action: "create", name: ($("c_name") || {}).value, slug: ($("c_slug") || {}).value,
    description: ($("c_desc") || {}).value, is_active: true
  });
  if (status === 201) {
    const created = (body.data && body.data.category) || null;
    if (created) state.adminCats = (state.adminCats || []).concat([created]);
    closeModal(); toast("Category created", "ok"); render();
    await loadAdmin(); refreshSoon();
  } else toast(friendly(body), "bad");
}

function newEndpoint() {
  openModal(`<div class="mh">New endpoint · ${esc(state.adminSlug)}</div><div class="mb">
    <div class="field"><label>Name</label><input id="e_name" placeholder="Resize image"/></div>
    <div class="field"><label>Slug</label><input id="e_slug" placeholder="resize"/></div>
    <div class="field"><label>Method</label><select id="e_method"><option>POST</option><option>GET</option></select></div>
    <div class="field"><label>Path</label><input id="e_path" placeholder="/v1/image/resize"/></div>
    <div class="field"><label>Handler key</label><input id="e_handler" placeholder="ai.chat"/></div>
    <p class="hint">A handler must exist in the gateway registry, otherwise calls return 501.</p>
  </div><div class="mf"><button class="btn grey" onclick="closeModal()">Cancel</button><button class="btn" onclick="createEndpoint()">Create</button></div>`);
}

async function createEndpoint() {
  const { status, body } = await call("endpointManage", {
    action: "create", api_slug: state.adminSlug,
    name: ($("e_name") || {}).value, slug: ($("e_slug") || {}).value,
    method: ($("e_method") || {}).value, path: ($("e_path") || {}).value,
    handler_key: ($("e_handler") || {}).value, is_active: true
  });
  if (status === 201) { closeModal(); toast("Endpoint created", "ok"); await loadAdmin(); }
  else toast(friendly(body), "bad");
}

/* ---------------- start ---------------- */
boot();
</script>
</body>
</html>
